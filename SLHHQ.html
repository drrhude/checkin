<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CVC Giveaway Quiz</title>
<meta name="description" content="Take our 60-second quiz to enter the Colleyville Chiropractic | CVC Spine & Sport giveaway.">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1D19; --deep:#3E4032; --olive:#6A6C57; --olive-2:#858873;
  --sage:#A9AF98; --sage-lt:#DCE0D2; --mist:#EEF0E8; --bg:#F7F8F4;
  --white:#FFFFFF; --gray:#7C7E72; --err:#9E3B2F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit}
.caps{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.28em}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--sage-lt)}
.back-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--sage-lt);background:var(--white);color:var(--olive);font-size:1rem;cursor:pointer;visibility:hidden}
.back-btn.show{visibility:visible}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
.brand .nm{font-family:'Oswald',sans-serif;text-transform:uppercase;color:var(--olive);line-height:1.05}
.brand .nm b{display:block;font-weight:500;font-size:.95rem;letter-spacing:.2em}
.brand .nm span{display:block;font-weight:400;font-size:.55rem;letter-spacing:.42em}
.tickets{min-width:34px;height:34px;padding:0 11px;border-radius:17px;background:var(--olive);color:var(--white);
  font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:5px;visibility:hidden;transition:transform .3s}
.tickets.show{visibility:visible}
.tickets.bump{transform:scale(1.25)}

/* PROGRESS */
.progress{display:flex;gap:5px;padding:12px 16px 0;max-width:560px;margin:0 auto}
.progress .pill{flex:1;height:5px;border-radius:3px;background:var(--sage-lt);transition:background .3s}
.progress .pill.done{background:var(--olive)}
.progress .pill.cur{background:var(--sage)}

.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HERO */
.hero{background:var(--white);border:1px solid var(--sage-lt);border-radius:24px;padding:28px 22px 24px;text-align:center;box-shadow:0 14px 40px rgba(62,64,50,.10)}
.hero .logo-full{width:170px;max-width:60%;height:auto;display:block;margin:0 auto 20px}
.eyebrow{font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--olive);font-weight:500;margin-bottom:10px}
.hero h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:2.05rem;line-height:1.1;margin-bottom:12px;color:var(--ink)}
.hero h1 em{color:var(--olive)}
.hero p{font-size:.96rem;line-height:1.5;color:var(--gray);margin-bottom:18px}
.prizes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.chip{background:var(--mist);border:1px solid var(--sage-lt);color:var(--deep);border-radius:20px;padding:6px 12px;font-size:.8rem;font-weight:500}
.lang{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
.lang button{flex:1;max-width:170px;padding:15px 10px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer}
.lang .en{background:var(--olive);color:var(--white);border:1.5px solid var(--olive)}
.lang .es{background:var(--white);color:var(--olive);border:1.5px solid var(--olive)}
.how{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how div{background:var(--mist);border-radius:12px;padding:10px 6px;font-size:.72rem;line-height:1.35;color:var(--deep)}
.how b{display:block;font-size:1.35rem;color:var(--olive);font-family:'Oswald',sans-serif;font-weight:500}

/* CARD */
.card{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--sage-lt);border-radius:22px;padding:22px 18px;box-shadow:0 10px 30px rgba(62,64,50,.08)}
.q-num{font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--olive);font-weight:500;margin-bottom:6px}
.q-title{font-family:'DM Serif Display',serif;font-size:1.65rem;line-height:1.15;margin-bottom:6px;color:var(--ink)}
.q-hint{font-size:.85rem;color:var(--gray);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--sage-lt);
  background:var(--white);cursor:pointer;transition:all .18s;user-select:none}
.opt .ic{font-size:1.35rem;width:30px;text-align:center;flex-shrink:0}
.opt .tx{flex:1}
.opt .lb{font-weight:500;font-size:.96rem}
.opt .sb{font-size:.76rem;color:var(--gray);margin-top:2px}
.opt .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sage-lt);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--white)}
.opt.multi .ck{border-radius:6px}
.opt.sel{border-color:var(--olive);background:var(--mist)}
.opt.sel .ck{background:var(--olive);border-color:var(--olive)}
.opt.sel .ck::after{content:'✓'}

.btn{width:100%;margin-top:18px;padding:16px;border:none;border-radius:14px;background:var(--ink);color:var(--white);
  font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.3;cursor:default}
.btn.brass{background:var(--olive);color:var(--white)}
.link{display:block;width:100%;margin-top:12px;background:none;border:none;color:var(--gray);font-size:.88rem;text-decoration:underline;cursor:pointer;padding:6px}

/* FORM */
.field{margin-bottom:12px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--deep);margin-bottom:5px}
.field input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--sage-lt);font-size:1rem;font-family:inherit;background:var(--white);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--olive)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.74rem;color:var(--gray);line-height:1.45;margin-top:4px;cursor:pointer}
.consent input{margin-top:2px;width:18px;height:18px;accent-color:var(--olive);flex-shrink:0}
.err{color:var(--err);font-size:.82rem;margin-top:10px;min-height:1em}

/* BONUS */
.bonus-banner{background:var(--olive);color:var(--white);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;align-items:center}
.bonus-banner .big{font-family:'Oswald',sans-serif;font-weight:500;font-size:2rem;line-height:1}
.bonus-banner .sm{font-size:.86rem;line-height:1.35;font-weight:500}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pt{padding:18px 6px;border-radius:16px;border:1.5px solid var(--sage-lt);background:var(--white);text-align:center;cursor:pointer;transition:all .18s}
.pt b{display:block;font-family:'Oswald',sans-serif;font-size:2.2rem;font-weight:500;color:var(--olive)}
.pt span{font-size:.75rem;color:var(--gray)}
.pt.sel{border-color:var(--olive);background:var(--mist)}
.staff{margin-top:16px;padding-top:14px;border-top:1px dashed var(--sage-lt)}
.staff .field input{text-align:center;letter-spacing:.4em;font-size:1.2rem}

/* RESULTS */
.res-top{position:relative;overflow:hidden;text-align:center;padding:26px 18px;background:linear-gradient(160deg,var(--deep),var(--olive));color:var(--white);border-radius:22px;margin-bottom:14px}
.res-top .wm{position:absolute;right:-18px;bottom:-30px;height:190px;opacity:.12;pointer-events:none}
.res-top .count{font-family:'Oswald',sans-serif;font-weight:500;font-size:4.4rem;line-height:1}
.res-top .lbl{font-family:'Oswald',sans-serif;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;margin-top:4px;opacity:.9}
.res-top p{font-size:.92rem;margin-top:12px;opacity:.92;line-height:1.5;position:relative}
.breakdown{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
.breakdown span{font-size:.72rem;background:rgba(255,255,255,.16);border-radius:12px;padding:4px 10px}
.rec{border-left:4px solid var(--olive);margin-bottom:12px}
.rec .tag{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--olive);font-weight:500}
.rec h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.45rem;margin:4px 0 6px}
.rec p{font-size:.9rem;line-height:1.5;color:var(--deep)}
.rec.second{border-left-color:var(--sage)}
.rec.second .tag{color:var(--olive-2)}
.footer{text-align:center;font-size:.72rem;color:var(--gray);line-height:1.6;padding:8px 16px 30px}
.footer a{color:var(--olive)}
@media(max-width:360px){.row{grid-template-columns:1fr}.q-title{font-size:1.45rem}.hero h1{font-size:1.8rem}.brand .nm{display:none}}
</style>
</head>

const SERVICES = {
  chiro:{en:['Chiropractic Care','Targeted adjustments to restore motion and ease back and neck pain \u2014 paired with a plan so results last.'],
         es:['Atenci\u00f3n Quiropr\u00e1ctica','Ajustes espec\u00edficos para recuperar movimiento y aliviar el dolor de espalda y cuello \u2014 con un plan para que dure.']},

  shock:{en:['Shockwave Therapy','Non-invasive acoustic wave therapy for stubborn tendon and heel pain. No needles, no downtime.'],

          es:['Programa de P\u00e9rdida de Peso','Un plan estructurado con seguimiento y responsabilidad \u2014 adaptado a tu horario.']},
  neuro:{en:['NeuroPath Nerve Program','A structured program for numbness, tingling and burning \u2014 starting with a thorough nerve evaluation.'],
         es:['Programa NeuroPath','Un programa estructurado para entumecimiento, hormigueo y ardor \u2014 empieza con una evaluaci\u00f3n completa de nervios.']}

/* ========= STATE ========= */
let lang = 'en';
const answers = {};            // id -> array of values
let contact = {}, gamePts = 0, consult = '', consultPts = 0, pickedPts = 0;
let idx = 0;                   // screen index
const SCREENS = ['hero', ...QS.map((q,i)=>'q'+i), 'contact', 'game', 'consult', 'results'];
const STEP_SCREENS = SCREENS.filter(s=>s!=='hero'&&s!=='results');

const $ = id => document.getElementById(id);
const t = k => T[lang][k];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ========= RENDER ========= */
function render(){
  const s = SCREENS[idx];
  $('backBtn').classList.toggle('show', idx>0 && idx<=QS.length+1);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  renderProgress(s);
  updateTickets(false);
  let html='';
  if(s==='hero') html = heroHTML();
  else if(s.startsWith('q')) html = qHTML(+s.slice(1));
  else if(s==='contact') html = contactHTML();
  else if(s==='game') html = gameHTML();
  else if(s==='consult') html = consultHTML();
  else html = resultsHTML();
  $('app').innerHTML = `<div class="screen active">${html}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderProgress(s){
  const p = $('progress');
  if(s==='hero'||s==='results'){p.innerHTML='';return;}
  const cur = STEP_SCREENS.indexOf(s);
  p.innerHTML = STEP_SCREENS.map((_,i)=>`<div class="pill ${i<cur?'done':i===cur?'cur':''}"></div>`).join('');
}

function heroHTML(){
  return `<div class="hero">
    <img class="logo-full" src="${LOGO_FULL}" alt="Colleyville Chiropractic">
    <div class="eyebrow">${t('heroEye')}</div>
    <h1>${t('heroH')}</h1>
    <p>${t('heroP')}</p>
    <div class="prizes">${t('prizes').map(p=>`<div class="chip">${p}</div>`).join('')}</div>
    <div class="eyebrow" style="margin-bottom:10px">Choose language · Elige idioma</div>
    <div class="lang">
      <button class="en" onclick="start('en')">English</button>
      <button class="es" onclick="start('es')">Español</button>
    </div>
    <div class="how">${t('how').map(h=>`<div><b>${h[0]}</b>${h[1]}</div>`).join('')}</div>
  </div>`;
}

function qHTML(i){
  const q = QS[i], sel = answers[q.id]||[];
  return `<div class="card">
    <div class="q-num">${t('q')} ${i+1} ${t('of')} ${QS.length}</div>
    <div class="q-title">${q.t[lang]}</div>
    <div class="q-hint">${q.multi?t('pickAll'):t('pickOne')}</div>
    <div class="opts">${q.o.map((o,j)=>`
      <div class="opt ${q.multi?'multi':''} ${sel.includes(o.v)?'sel':''}" onclick="pick(${i},${j})">
        <div class="ic">${o.i}</div>
        <div class="tx"><div class="lb">${o[lang][0]}</div>${o[lang][1]?`<div class="sb">${o[lang][1]}</div>`:''}</div>
        <div class="ck"></div>
      </div>`).join('')}</div>
    ${q.multi?`<button class="btn" id="nextBtn" onclick="next()" ${sel.length?'':'disabled'}>${t('next')}</button>`:''}
  </div>`;
}

function contactHTML(){
  return `<div class="card">
    <div class="q-title">${t('cTitle')}</div>
    <div class="q-hint">${t('cHint')}</div>
    <div class="row">
      <div class="field"><label>${t('first')}</label><input id="fFirst" autocomplete="given-name" value="${esc(contact.first_name||'')}"></div>
      <div class="field"><label>${t('last')}</label><input id="fLast" autocomplete="family-name" value="${esc(contact.last_name||'')}"></div>
    </div>
    <div class="field"><label>${t('phone')}</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(817) 555-0123" value="${esc(contact.phone||'')}"></div>
    <div class="field"><label>${t('email')}</label><input id="fEmail" type="email" inputmode="email" autocomplete="email" value="${esc(contact.email||'')}"></div>
    <label class="consent"><input type="checkbox" id="fConsent" ${contact.sms_consent?'checked':''}><span>${t('consent')}</span></label>
    <div class="err" id="err"></div>
    <button class="btn brass" onclick="submitContact()">${t('enter')} 🎟</button>
  </div>`;
}

function gameHTML(){
  const labels = {3:t('pt3'),2:t('pt2'),1:t('pt1')};
  return `<div class="card">
    <div class="q-title">${t('gTitle')}</div>
    <div class="bonus-banner"><div class="big">+3</div><div class="sm">${t('gBanner')}</div></div>
    <div class="q-hint">${t('gHint')}</div>
    <div class="pts">${[3,2,1].map(n=>`<div class="pt ${pickedPts===n?'sel':''}" onclick="pickPts(${n})"><b>+${n}</b><span>${labels[n]}</span></div>`).join('')}</div>
    <div class="staff">
      <div class="field"><label style="text-align:center">${t('pin')}</label><input id="fPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="btn brass" onclick="submitGame()">${t('addPts')}</button>
    <button class="link" onclick="skipGame()">${t('skip')}</button>
  </div>`;
}

function consultHTML(){
  const opts = [['book','📲','k1','k1s'],['table','🤝','k2','k2s'],['call','📞','k3','k3s'],['none','🙂','k4','k4s']];
  return `<div class="card">
    <div class="q-title">${t('kTitle')}</div>
    <div class="bonus-banner"><div class="big">+1</div><div class="sm">${t('kBanner')}</div></div>
    <div class="q-hint">${t('kHint')}</div>
    <div class="opts">${opts.map(o=>`
      <div class="opt ${consult===o[0]?'sel':''}" onclick="pickConsult('${o[0]}')">
        <div class="ic">${o[1]}</div>
        <div class="tx"><div class="lb">${t(o[2])}</div><div class="sb">${t(o[3])}</div></div>
        <div class="ck"></div>
      </div>`).join('')}</div>
    <button class="btn brass" onclick="finish()" ${consult?'':'disabled'}>${t('finish')} 🎟</button>
  </div>`;
}

function resultsHTML(){
  const [a,b] = topServices();
  const total = totalEntries();
  return `<div class="res-top"><img class="wm" src="${LOGO_W}" alt="">
      <div class="count">${total}</div>
      <div class="lbl">${t('rLabel')}</div>
      <div class="breakdown">
        <span>${t('bQuiz')} +1</span>${gamePts?`<span>${t('bGame')} +${gamePts}</span>`:''}${consultPts?`<span>${t('bConsult')} +1</span>`:''}
      </div>
      <p>${t('rP')}</p>
    </div>
    <div class="card rec"><div class="tag">${t('recTag')}</div><h3>${SERVICES[a][lang][0]}</h3><p>${SERVICES[a][lang][1]}</p></div>
    ${b?`<div class="card rec second"><div class="tag">${t('secTag')}</div><h3>${SERVICES[b][lang][0]}</h3><p>${SERVICES[b][lang][1]}</p></div>`:''}
    ${consult==='table'?`<div class="q-hint" style="text-align:center;margin-top:10px;font-weight:700;color:var(--olive)">${t('showTeam')}</div>`:''}
    <button class="link" onclick="resetAll()">${t('again')}</button>`;
}

/* ========= ACTIONS ========= */
function start(l){ lang=l; idx=1; render(); }
function next(){ idx++; render(); }
function goBack(){ if(idx>0){ idx--; render(); } }

function pick(i,j){
  const q=QS[i], o=q.o[j];
  let sel = answers[q.id]||[];
  if(!q.multi){ answers[q.id]=[o.v]; render(); setTimeout(next,220); return; }
  if(sel.includes(o.v)) sel = sel.filter(v=>v!==o.v);
  else if(o.excl) sel=[o.v];
  else sel = sel.filter(v=>!q.o.find(x=>x.v===v&&x.excl)).concat(o.v);
  answers[q.id]=sel; render();
}

function submitContact(){
  const first=$('fFirst').value.trim(), last=$('fLast').value.trim();
  const phone=$('fPhone').value.replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
  const email=$('fEmail').value.trim();
  const err=$('err');
  if(!first||!last){err.textContent=t('errName');return;}
  if(phone.length!==10){err.textContent=t('errPhone');return;}
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t('errEmail');return;}
  contact={first_name:first,last_name:last,phone,email,sms_consent:$('fConsent').checked};
  send('entered');
  idx++; render(); updateTickets(true);
}

function pickPts(n){ pickedPts=n; document.querySelectorAll('.pt').forEach(el=>el.classList.toggle('sel', el.querySelector('b').textContent==='+'+n)); }
function submitGame(){
  const err=$('err');
  if(!pickedPts){err.textContent=t('errPts');return;}
  if($('fPin').value.trim()!==STAFF_PIN){err.textContent=t('errPin');return;}
  gamePts=pickedPts; idx++; render(); updateTickets(true);
}
function skipGame(){ gamePts=0; pickedPts=0; idx++; render(); }

function pickConsult(k){
  consult=k; consultPts=(k==='book'||k==='table')?1:0;
  if(k==='book') window.open(BOOK_URL,'_blank');
  render(); updateTickets(true);
}
function finish(){ send('completed'); idx++; render(); }

function resetAll(){
  for(const k in answers) delete answers[k];
  contact={}; gamePts=0; pickedPts=0; consult=''; consultPts=0; idx=0; render();
}

/* ========= LOGIC ========= */
function totalEntries(){ return (contact.phone?1:0)+gamePts+consultPts; }
function updateTickets(bump){
  const n=totalEntries(), el=$('tickets');
  $('ticketCount').textContent=n;
  el.classList.toggle('show', n>0);
  if(bump){ el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),300); }
}
function scores(){
  const sc={chiro:0,rehab:0,shock:0,massage:0,weight:0,neuro:0};
  QS.forEach(q=>(answers[q.id]||[]).forEach(v=>{
    const o=q.o.find(x=>x.v===v); if(o) for(const k in o.s) sc[k]+=o.s[k];
  }));
  return sc;
}
function topServices(){
  const sc=scores();
  const order=['chiro','shock','neuro','rehab','massage','weight']; // tie-break
  const ranked=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]||order.indexOf(a)-order.indexOf(b));
  const first=sc[ranked[0]]>0?ranked[0]:'chiro';
  const second=sc[ranked[1]]>0?ranked[1]:null;
  return [first, second===first?null:second];
}

function send(stage){
  if(!WEBHOOK.startsWith('http')) { console.warn('Webhook not set'); return; }
  const [a,b]=topServices();
  const payload={
    ...contact,
    language:lang, source:EVENT_TAG, submission_stage:stage,
    concerns:(answers.concerns||[]).join(', '),
    pain_duration:(answers.duration||[]).join(', '),
    tried:(answers.tried||[]).join(', '),
    goal:(answers.goal||[]).join(', '),
    service_interests:(answers.interests||[]).join(', '),
    recommended_service:SERVICES[a].en[0],
    secondary_service:b?SERVICES[b].en[0]:'',
    game_points:gamePts,
    consult_choice:{book:'Booked online',table:'Schedule at table',call:'Call me later',none:'No thanks'}[consult]||'',
    total_entries:totalEntries(),
    service_scores:JSON.stringify(scores())
  };
  fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true})
    .catch(e=>console.warn('Webhook:',e));
}

/* ?lang=es skips straight into Spanish */
const qp=new URLSearchParams(location.search).get('lang');
if(qp==='es'||qp==='en'){ lang=qp; idx=1; }
render();
</script>
